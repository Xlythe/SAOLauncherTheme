apply plugin: 'com.android.application'

android {
    namespace 'com.xlythe.saolauncher.theme.awesome'
    compileSdk 37
    defaultConfig {
        applicationId 'com.xlythe.saolauncher.theme.awesome'
        minSdk 14
        targetSdk 37
        versionCode 5
        versionName '1.4'
    }
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation 'com.xlythe:theme-engine:3.0.1'
}
