apply plugin: 'com.android.application'

android {
    namespace 'com.xlythe.saolauncher.theme.newage'
    compileSdk 37
    defaultConfig {
        applicationId 'com.xlythe.saolauncher.theme.newage'
        minSdk 14
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation 'com.xlythe:theme-engine:3.0.0'
}
